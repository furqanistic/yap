[package]
name = "yap"
version = "0.1.0"
description = "Yap — AI-powered voice dictation"
authors = ["Furqan Afzal"]
edition = "2021"
license = "MIT"
repository = "https://github.com/furqanistic/yap"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "macros", "rt"] }
tokio-util = "0.7"
fs4 = "1"
cpal = "0.18"
rubato = "5"
hound = "3.5"
whisper-rs = { version = "0.16", features = ["log_backend"] }
realfft = "3.5"
num_cpus = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# whisper.cpp is unusably slow unoptimized, so build it optimized even in dev.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
